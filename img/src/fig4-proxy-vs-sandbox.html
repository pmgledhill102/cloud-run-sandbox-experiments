<text x="40" y="52" class="t-title">A proxy only controls traffic that has to go through it</text>
<text x="40" y="84" class="t-sub">Same proxy, same allowlist. On the left, any process can ignore it. On the right, there is no other way out.</text>
<text x="40" y="150" class="t-card" style="font-size:21px;font-weight:700">Proxy next to the workload</text><text x="40" y="176" class="t-sub" style="font-size:15.5px">Containers in an instance share one network</text><rect x="40" y="200" width="430" height="400" rx="10" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><text x="60" y="228" class="t-zone" style="fill:#1967D2">Cloud Run instance</text><g filter="url(#sh)"><rect x="70" y="250" width="250" height="70" rx="8" class="card"/></g><use href="#g-shield" x="84" y="265"/><text x="134" y="280" class="t-card">Egress proxy</text><text x="134" y="301" class="t-card2">hostname allowlist</text><g filter="url(#sh)"><rect x="80" y="470" width="260" height="70" rx="8" class="card"/></g><use href="#g-proc" x="94" y="485"/><text x="144" y="500" class="t-card">CI job or agent</text><text x="144" y="521" class="t-card2">untrusted code</text><g filter="url(#sh)"><rect x="560" y="250" width="230" height="70" rx="8" class="card"/></g><use href="#g-web" x="574" y="265"/><text x="624" y="280" class="t-card">Allowed hosts</text><text x="624" y="301" class="t-card2">GitHub, package registries</text><g filter="url(#sh)"><rect x="560" y="385" width="230" height="70" rx="8" class="card"/></g><use href="#g-web" x="574" y="400"/><text x="624" y="415" class="t-card">Any other host</text><text x="624" y="436" class="t-card2">attacker's server</text><g filter="url(#sh)"><rect x="560" y="520" width="230" height="70" rx="8" class="card"/></g><use href="#g-md" x="574" y="535"/><text x="624" y="550" class="t-card">Metadata server</text><text x="624" y="571" class="t-card2">cloud credentials</text><path d="M195 466 V324" class="arrow" marker-end="url(#ah)"/><path d="M320 285 H556" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#ahg)"/><path d="M340 495 C440 470 480 430 556 420" stroke="#D93025" stroke-width="2.5" fill="none" marker-end="url(#ahr)"/><path d="M340 515 C440 530 480 550 556 555" stroke="#D93025" stroke-width="2.5" fill="none" marker-end="url(#ahr)"/><text x="360" y="586" class="t-note" style="fill:#C5221F;font-weight:500">ignores the proxy</text>
<text x="850" y="150" class="t-card" style="font-size:21px;font-weight:700">Proxy outside a sandbox</text><text x="850" y="176" class="t-sub" style="font-size:15.5px">The untrusted code has no network of its own</text><rect x="850" y="200" width="430" height="400" rx="10" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><text x="870" y="228" class="t-zone" style="fill:#1967D2">Cloud Run instance</text><g filter="url(#sh)"><rect x="880" y="250" width="250" height="70" rx="8" class="card"/></g><use href="#g-shield" x="894" y="265"/><text x="944" y="280" class="t-card">Egress proxy</text><text x="944" y="301" class="t-card2">hostname allowlist</text><rect x="870" y="410" width="390" height="170" rx="8" fill="#E6F4EA" stroke="#A8DAB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1245" y="436" class="t-zone" text-anchor="end" style="fill:#137333">Sandbox · no network</text><g filter="url(#sh)"><rect x="890" y="470" width="260" height="70" rx="8" class="card"/></g><use href="#g-proc" x="904" y="485"/><text x="954" y="500" class="t-card">CI job or agent</text><text x="954" y="521" class="t-card2">untrusted code</text><g filter="url(#sh)"><rect x="1370" y="250" width="230" height="70" rx="8" class="card"/></g><use href="#g-web" x="1384" y="265"/><text x="1434" y="280" class="t-card">Allowed hosts</text><text x="1434" y="301" class="t-card2">GitHub, package registries</text><g filter="url(#sh)"><rect x="1370" y="385" width="230" height="70" rx="8" class="card"/></g><use href="#g-web" x="1384" y="400"/><text x="1434" y="415" class="t-card">Any other host</text><text x="1434" y="436" class="t-card2">attacker's server</text><g filter="url(#sh)"><rect x="1370" y="520" width="230" height="70" rx="8" class="card"/></g><use href="#g-md" x="1384" y="535"/><text x="1434" y="550" class="t-card">Metadata server</text><text x="1434" y="571" class="t-card2">cloud credentials</text><path d="M1005 466 V324" class="arrow" marker-end="url(#ah)"/><rect x="1015" y="372" width="150" height="26" rx="13" fill="#FFFFFF" stroke="#DADCE0"/><text x="1090" y="390" class="t-note" text-anchor="middle">stdin / stdout</text><path d="M1130 285 H1366" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#ahg)"/><path d="M1260 420 H1366" stroke="#D93025" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="1315" cy="420" r="13" fill="#FFFFFF" stroke="#D93025" stroke-width="2"/><path d="M1309 414 l12 12 M1321 414 l-12 12" stroke="#D93025" stroke-width="2.5"/><path d="M1260 555 H1366" stroke="#D93025" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="1315" cy="555" r="13" fill="#FFFFFF" stroke="#D93025" stroke-width="2"/><path d="M1309 549 l12 12 M1321 549 l-12 12" stroke="#D93025" stroke-width="2.5"/>
<line x1="820" y1="130" x2="820" y2="600" stroke="#DADCE0" stroke-width="1.5"/>
<text x="40" y="650" class="t-src">Tested 2026-11-07: from the host container, direct connections and the metadata server both worked; from the sandbox, neither did, with or without the proxy.</text>
