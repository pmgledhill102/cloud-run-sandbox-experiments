<text x="40" y="52" class="t-title">Many connections over one pipe</text><text x="40" y="84" class="t-sub">The host starts the sandbox as its own child process, so it owns the sandbox's stdin and stdout, and multiplexes TCP over them.</text><rect x="40" y="120" width="1080" height="190" rx="10" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><text x="60" y="146" class="t-zone" style="fill:#1967D2">Host container · trusted · has the internet and the metadata server</text><g filter="url(#sh)"><rect x="70" y="190" width="300" height="70" rx="8" class="card"/></g><use href="#g-proc" x="84" y="205"/><text x="134" y="220" class="t-card">Bridge, host end</text><text x="134" y="241" class="t-card2">starts the sandbox, owns its stdio</text><g filter="url(#sh)"><rect x="560" y="190" width="280" height="70" rx="8" class="card"/></g><use href="#g-shield" x="574" y="205"/><text x="624" y="220" class="t-card">Egress proxy</text><text x="624" y="241" class="t-card2">allowlist, checks every DNS answer</text><path d="M374 225 H556" class="arrow" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="1160" y="190" width="230" height="70" rx="8" class="card"/></g><use href="#g-web" x="1174" y="205"/><text x="1224" y="220" class="t-card">Allowed hosts</text><text x="1224" y="241" class="t-card2">GitHub, package registries</text><path d="M844 225 H1156" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#ahg)"/><path d="M220 264 V466" stroke="#1A73E8" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"/><path d="M200 264 V466" stroke="#1A73E8" stroke-width="3" fill="none" opacity=".55"/><path d="M240 264 V466" stroke="#1A73E8" stroke-width="3" fill="none" opacity=".55"/><rect x="258" y="338" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#DADCE0"/><text x="272" y="361" class="t-card" style="font-size:15.5px">One pipe pair: stdin and stdout</text><text x="272" y="382" class="t-card2">several TCP streams, multiplexed (yamux)</text><rect x="40" y="420" width="1080" height="320" rx="10" fill="#E6F4EA" stroke="#A8DAB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="726" class="t-zone" style="fill:#137333">Sandbox · untrusted · no network · HTTPS_PROXY=127.0.0.1:3128</text><g filter="url(#sh)"><rect x="70" y="560" width="300" height="70" rx="8" class="card"/></g><use href="#g-proc" x="84" y="575"/><text x="134" y="590" class="t-card">Bridge, inside end</text><text x="134" y="611" class="t-card2">listens on 127.0.0.1:3128</text><g filter="url(#sh)"><rect x="560" y="450" width="280" height="70" rx="8" class="card"/></g><use href="#g-proc" x="574" y="465"/><text x="624" y="480" class="t-card">The workload</text><text x="624" y="501" class="t-card2">CI job or coding agent</text><g filter="url(#sh)"><rect x="560" y="550" width="280" height="70" rx="8" class="card"/></g><use href="#g-proc" x="574" y="565"/><text x="624" y="580" class="t-card">git</text><text x="624" y="601" class="t-card2">clone, fetch</text><g filter="url(#sh)"><rect x="560" y="650" width="280" height="70" rx="8" class="card"/></g><use href="#g-proc" x="574" y="665"/><text x="624" y="680" class="t-card">pip, npm</text><text x="624" y="701" class="t-card2">package downloads</text><path d="M556 485 C460 485 470 572 374 572" class="arrow" marker-end="url(#ah)"/><path d="M556 595 H374" class="arrow" marker-end="url(#ah)"/><path d="M556 685 C460 685 470 618 374 618" class="arrow" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="1160" y="560" width="230" height="70" rx="8" class="card"/></g><use href="#g-md" x="1174" y="575"/><text x="1224" y="590" class="t-card">Metadata server</text><text x="1224" y="611" class="t-card2">from the host only</text><path d="M1120 595 H1156" stroke="#D93025" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="1138" cy="595" r="13" fill="#FFFFFF" stroke="#D93025" stroke-width="2"/><path d="M1132 589 l12 12 M1144 589 l-12 12" stroke="#D93025" stroke-width="2.5"/><text x="40" y="778" class="t-src">Each stream opens with the name of the host service it wants; the host end connects only to names it was configured with. Inside, the bridge sends the command's own output to stderr, so nothing else writes to the tunnel.</text>
