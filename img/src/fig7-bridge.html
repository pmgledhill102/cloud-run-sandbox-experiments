<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"></head><body>

  <g id="g-shield"><path d="M20 3 L34 9 L34 20 C34 29 27 35 20 38 C13 35 6 29 6 20 L6 9 Z" fill="#34A853"/><path d="M13 20 L18 25 L28 14" stroke="#fff" stroke-width="3" fill="none"/></g>

  <g id="g-gh"><circle cx="20" cy="20" r="17" fill="#3C4043"/><path d="M12 20 l5 5 l11-11" stroke="#fff" stroke-width="3" fill="none"/></g>

<text x="40" y="52" class="t-title">Many connections over one pipe</text>
<text x="40" y="84" class="t-sub">Everything runs in one container. It starts the sandbox as a child process, owns the sandbox's stdin and stdout, and multiplexes TCP over them.</text>
<rect x="40" y="110" width="1080" height="640" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="60" y="140" class="t-zone" style="fill:#1967D2;font-weight:700">One Cloud Run instance · one container</text>
<text x="60" y="162" class="t-zone" style="fill:#1967D2">Outside the sandbox · trusted · has the internet and the metadata server</text>
<rect x="70" y="190" width="300" height="70" rx="8" class="card"/>
<use href="#g-proc" x="84" y="205"/>
<text x="134" y="220" class="t-card">Bridge, outside end</text>
<text x="134" y="241" class="t-card2">starts the sandbox, owns its stdio</text>
<rect x="560" y="190" width="280" height="70" rx="8" class="card"/>
<use href="#g-shield" x="574" y="205"/>
<text x="624" y="220" class="t-card">Egress proxy</text>
<text x="624" y="241" class="t-card2">allowlist, checks every DNS answer</text>
<path d="M374 225 H556" class="arrow" marker-end="url(#ah)"/>
<rect x="1160" y="190" width="230" height="70" rx="8" class="card"/>
<use href="#g-web" x="1174" y="205"/>
<text x="1224" y="220" class="t-card">Allowed hosts</text>
<text x="1224" y="241" class="t-card2">GitHub, package registries</text>
<path d="M844 225 H1156" stroke="#188038" stroke-width="2.5" fill="none" marker-end="url(#ahg)"/>
<text x="1000" y="214" text-anchor="middle" class="t-card2" style="fill:#137333;font-weight:500">the only way out</text>
<rect x="60" y="400" width="1040" height="330" rx="10" fill="#E6F4EA" stroke="#A8DAB5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="716" class="t-zone" style="fill:#137333">Sandbox · untrusted · no network · HTTPS_PROXY=127.0.0.1:3128</text>
<path d="M220 264 V536" stroke="#1A73E8" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"/>
<path d="M200 264 V536" stroke="#1A73E8" stroke-width="3" fill="none" opacity=".55"/>
<path d="M240 264 V536" stroke="#1A73E8" stroke-width="3" fill="none" opacity=".55"/>
<rect x="258" y="300" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#DADCE0"/>
<text x="272" y="323" class="t-card" style="font-size:15.5px">One pipe pair: stdin and stdout</text>
<text x="272" y="344" class="t-card2">several TCP streams, multiplexed (yamux)</text>
<rect x="70" y="540" width="300" height="70" rx="8" class="card"/>
<use href="#g-proc" x="84" y="555"/>
<text x="134" y="570" class="t-card">Bridge, inside end</text>
<text x="134" y="591" class="t-card2">listens on 127.0.0.1:3128</text>
<rect x="560" y="425" width="280" height="70" rx="8" class="card"/>
<use href="#g-proc" x="574" y="440"/>
<text x="624" y="455" class="t-card">The workload</text>
<text x="624" y="476" class="t-card2">CI job or coding agent</text>
<rect x="560" y="525" width="280" height="70" rx="8" class="card"/>
<use href="#g-proc" x="574" y="540"/>
<text x="624" y="555" class="t-card">git</text>
<text x="624" y="576" class="t-card2">clone, fetch</text>
<rect x="560" y="625" width="280" height="70" rx="8" class="card"/>
<use href="#g-proc" x="574" y="640"/>
<text x="624" y="655" class="t-card">pip, npm</text>
<text x="624" y="676" class="t-card2">package downloads</text>
<path d="M556 460 C460 460 470 552 374 552" class="arrow" marker-end="url(#ah)"/>
<path d="M556 575 H374" class="arrow" marker-end="url(#ah)"/>
<path d="M556 660 C460 660 470 598 374 598" class="arrow" marker-end="url(#ah)"/>
<rect x="1160" y="540" width="230" height="70" rx="8" class="card"/>
<use href="#g-md" x="1174" y="555"/>
<text x="1224" y="570" class="t-card">Metadata server</text>
<text x="1224" y="591" class="t-card2">outside the sandbox only</text>
<path d="M1100 575 H1156" stroke="#D93025" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<circle cx="1135" cy="575" r="13" fill="#FFFFFF" stroke="#D93025" stroke-width="2"/>
<path d="M1129 569 l12 12 M1141 569 l-12 12" stroke="#D93025" stroke-width="2.5"/>
<text x="40" y="778" class="t-src">Each stream opens with the name of the service it wants; the outside end connects only to names it was configured with. Inside, the bridge sends the command's own output to stderr, so nothing else writes to the tunnel.</text>
</svg></body></html>
